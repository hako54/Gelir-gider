<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasa Defteri</title>
<meta name="description" content="Gelir, gider ve düzenli ödemelerini (kredi, kart, aidat, faturalar) aylar ve yıllar boyunca takip et.">
<meta name="theme-color" content="#2b3a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#ozet" data-act="tab" data-tab="ozet" aria-label="Kasa Defteri ana sayfa">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 21.5h14M10.5 18V12M16 18V9M21.5 18v-4" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Kasa Defteri</span>
    </a>
    <nav class="tabs" aria-label="Bölümler">
      <button type="button" data-act="tab" data-tab="ozet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Özet</span></button>
      <button type="button" data-act="tab" data-tab="odemeler">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Ödemeler</span></button>
      <button type="button" data-act="tab" data-tab="kayitlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Kayıtlar</span></button>
      <button type="button" data-act="tab" data-tab="ayarlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ayarlar</span></button>
    </nav>
    <button type="button" class="btn primary add-desktop" data-act="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Yeni kayıt</button>
  </div>
</header>

<main id="main" class="wrap">
  <div id="banner"></div>
  <section id="view-ozet" class="view" hidden></section>
  <section id="view-odemeler" class="view" hidden></section>
  <section id="view-kayitlar" class="view" hidden></section>
  <section id="view-ayarlar" class="view" hidden></section>
</main>

<button type="button" class="fab" data-act="add" aria-label="Yeni kayıt ekle">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="sheet" aria-label="Pencere"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<!--/APP-->
<script src="js/capacitor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
